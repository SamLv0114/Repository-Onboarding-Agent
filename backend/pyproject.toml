[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-onboarding-agent-api"
version = "0.1.0"
description = "AMS 691 Repository Onboarding Agent API scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "langchain-openai>=1.7.2",
  "python-dotenv>=1.2.4",
  "langgraph>=1.2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
agent = ["langgraph>=0.2,<2", "langchain-openai>=0.3,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
